<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="320" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#eff6ff"/>
      <stop offset="0.5" stop-color="#fce7f3"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="hair" x1="120" y1="20" x2="200" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="skin" x1="140" y1="50" x2="180" y2="130" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fed7aa"/>
      <stop offset="1" stop-color="#fbcfe8"/>
    </linearGradient>
  </defs>
  <rect width="320" height="240" rx="16" fill="url(#bg)"/>
  <!-- Polaroid border effect -->
  <rect x="12" y="12" width="296" height="216" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Mini background -->
  <rect x="24" y="24" width="272" height="155" rx="8" fill="#f8fafc"/>
  <circle cx="80" cy="60" r="30" fill="#dbeafe" opacity="0.6"/>
  <circle cx="240" cy="70" r="40" fill="#fce7f3" opacity="0.5"/>

  <!-- Abu Bakar Portrait In Selfie Frame -->
  <g transform="translate(80, 10)">
    <!-- Hair back -->
    <path fill="url(#hair)" d="M52 48c-2-20 16-36 36-36 20 0 36 12 36 32v24H52V48Z"/>
    <!-- Outfit (Stylish jacket & t-shirt) -->
    <path fill="#1e293b" d="M30 150c4-28 20-46 58-50 38 4 54 22 58 50H30Z"/>
    <path fill="#3b82f6" d="M72 100l16 35 16-35c-10 4-22 4-32 0Z"/>
    <!-- Neck -->
    <rect x="80" y="86" width="16" height="20" rx="4" fill="url(#skin)"/>
    <!-- Face -->
    <path fill="url(#skin)" d="M64 62c0-16 11-28 24-28s24 12 24 28v14c0 14-11 25-24 25s-24-11-24-25V62Z"/>
    <!-- Handsome stylish short hair -->
    <path fill="url(#hair)" d="M58 46c4-20 20-28 32-28 16 0 28 10 30 22-8-4-18-6-24-6-16 0-26 6-38 12Z"/>
    <!-- Sideburns -->
    <path fill="url(#hair)" d="M62 48v16l4-2v-14H62Zm52 0v16l-4-2v-14h4Z"/>
    <!-- Eyebrows -->
    <path stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" d="M70 58 Q 78 55 84 57"/>
    <path stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" d="M92 57 Q 98 55 106 58"/>
    <!-- Sparkling eye -->
    <ellipse cx="77" cy="67" rx="3.5" ry="4" fill="#0f172a"/>
    <circle cx="76" cy="65.5" r="1.2" fill="#fff"/>
    <!-- Playful winking eye -->
    <path stroke="#0f172a" stroke-width="2.2" stroke-linecap="round" d="M94 67 Q 99 63 104 67"/>
    <!-- Charming boyish smile -->
    <path stroke="#be123c" stroke-width="2.2" stroke-linecap="round" d="M81 80 Q 88 86 95 80"/>
    <!-- Hand holding phone / peace sign -->
    <circle cx="125" cy="110" r="10" fill="#fed7aa"/>
    <rect x="120" y="90" width="8" height="22" rx="4" fill="#fed7aa"/>
    <rect x="130" y="94" width="7" height="20" rx="3.5" fill="#fed7aa"/>
  </g>

  <!-- Polaroid Bottom Handwritten Caption -->
  <text x="160" y="205" text-anchor="middle" font-family="'Caveat', 'Playfair Display', cursive, serif" font-size="16" font-weight="700" fill="#2563eb">“Just for you, pagli! 😉 Miss korchilam tomai! ♡”</text>
</svg>
